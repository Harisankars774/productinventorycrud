<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD APP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary">
            Product Inventory CRUD
        </h1>
        <form id="productform">
            <div class="row my-5">
                <input type="text" id="editstatus" hidden>
                <div class="col-lg-3">
                    <input id="pid" type="text" placeholder="Product ID" class="form-control">
                </div>
                <div class="col-lg-3">
                    <input id="pname" type="text" placeholder="Product Name" class="form-control">
                </div>
                <div class="col-lg-3">
                    <select id="category" class="form-select">
                        <option selected disabled>Select Category</option>
                        <option>Accessories</option>
                        <option>Electronics</option>
                        <option>Clothing</option>
                    </select>
                </div>
                <div class="col-lg-3">
                    <input id="price" type="number" placeholder="Price" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-lg-3">
                    <input id="quantity" type="number" placeholder="Quantity" class="form-control">
                </div>
                <div class="col-lg-3">
                    <button type="submit" class="btn btn-success w-100">
                        Add Product
                    </button>
                </div>
            </div>
        </form>
        <div class="row my-5">
            <div class="col-lg-6">
                <input id="search" type="text" placeholder="Search product name" class="form-control">
            </div>
            <div class="col-lg-6">
                <select id="filterCategory" class="form-select">
                    <option selected>All Categories</option>
                    <option>Accessories</option>
                    <option>Electronics</option>
                    <option>Clothing</option>
                </select>
            </div>
        </div>
        <table class="table table-bordered table-hover my-5">
            <thead class="table-dark text-center">
                <tr>
                    <th>#</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tablebody">
            </tbody>
        </table>
    </div>
    <script src="./main.js"></script>
</body>
</html>
